; Game localization target: gather -> export (PO) -> import -> compile, driven by the Localization Dashboard or
;   UnrealEditor-Cmd.exe Afterclass.uproject -run=GatherText -config="Config/Localization/Game_Gather.ini"
; Output goes to Content/Localization/Game/<culture>/ (UE standard). Translator hand-off CSVs live in
; Localization/Game/<culture>/TRANSLATION_PENDING.csv (ja, ko, es-419 are EMPTY: KNOWN_ISSUES KI-015).
; Not executed in the authoring environment (no UE install).

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ja
CulturesToGenerate=ko
CulturesToGenerate=es-419

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Source
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Game.csv
